<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="description" content="Astrovoyage subsector and sector generator"/><title>Astrovoyage Sector Generator</title><link rel="stylesheet" href="styles.css"/><link rel="stylesheet" href="visual-fixes.css"/><link rel="stylesheet" href="horizontal-grid.css"/></head><body><header class="topbar"><div><p class="eyebrow">ASTROVOYAGE</p><h1>Sector Generator</h1></div><div class="top-actions"><button id="newSubsectorBtn">New Subsector</button><button id="newSectorBtn">New Sector</button><button id="shareBtn" class="primary">Share Map</button></div></header><main class="app-shell"><aside class="sidebar"><section class="panel"><h2>Map</h2><label>Title<input id="mapTitle" maxlength="80" placeholder="Untitled Map"/></label><label>Mode<select id="mapMode"><option value="subsector">Subsector · 8 × 10</option><option value="sector">Sector · 24 × 30</option></select></label><div class="button-row"><button id="generateBtn" class="primary">Generate</button><button id="clearBtn" class="danger">Clear</button></div><label class="check"><input id="confirmGenerate" type="checkbox"/> Replace existing worlds when generating</label></section><section class="panel"><h2>Selected Hex</h2><div id="emptySelection" class="muted">Select a hex to edit it.</div><div id="hexEditor" hidden><div class="hex-id" id="hexId"></div><label>Content<select id="hexKind"><option value="empty">Empty</option><option value="world">World</option><option value="anomaly">Anomaly</option></select></label><div id="worldFields"><label>World name<input id="worldName" maxlength="80"/></label><label>Planet code<input id="planetCode" maxlength="5" autocomplete="off"/></label><div class="code-grid"><label>Type<select id="type"><option>A</option><option>D</option><option>E</option><option>S</option><option>W</option></select></label><label>Gravity<select id="gravity"><option>E</option><option>H</option><option>L</option><option>O</option></select></label><label>Atmosphere<select id="atmosphere"><option>A</option><option>C</option><option>E</option><option>I</option><option>O</option><option>T</option><option>X</option></select></label><label>Population<select id="population"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label>Biosphere<select id="biosphere"><option>A</option><option>E</option><option>O</option></select></label></div><label>Notes<textarea id="worldNotes" rows="5" placeholder="GM / player notes"></textarea></label></div><div id="anomalyFields" hidden><label>Anomaly name<input id="anomalyName" maxlength="80" placeholder="Black hole / anomaly"/></label><label>Notes<textarea id="anomalyNotes" rows="5"></textarea></label></div><button id="applyHexBtn" class="primary full">Apply Changes</button></div></section><section class="panel compact"><h2>Export</h2><div class="button-stack"><button id="exportBtn">Export JSON</button><button id="exportPngBtn">Export PNG · transparent</button><button id="exportTiffBtn">Export TIFF · transparent</button><button id="exportJpgBtn">Export JPG</button><label class="file-button">Import JSON<input id="importInput" type="file" accept="application/json"/></label><button id="copyJsonBtn">Copy Map Data</button></div><p class="muted small">PNG and TIFF preserve transparency outside the hexes. JPG cannot store transparency, so its outside area is black.</p></section></aside><section class="workspace"><div class="workspace-bar"><div><strong id="workspaceTitle">Untitled Map</strong><span id="workspaceMeta"></span></div><div class="legend"><span><i class="legend-dot" style="background:#c94b4b"></i>Desert</span><span><i class="legend-dot" style="background:#4caf63"></i>Earth-like</span><span><i class="legend-dot" style="background:#183f7a"></i>Water</span><span><i class="legend-dot" style="background:#aaa59a"></i>Asteroid</span><span><i class="legend-dot" style="background:#b05cff"></i>Station</span></div></div><div id="mapViewport" class="map-viewport"><div id="map" class="hex-map"></div></div></section></main><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="app-enhanced.js"></script><script src="horizontal-grid.js"></script></body></html>
